<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شقير العطار — عطارة مصرية أصيلة في الرحاب</title>
  <meta name="description" content="عطارة شقير العطار في سوق الرحاب التجاري القديم — البن البرازيلي بدرجات تحميص مختلفة، التوابل والبهارات، الأعشاب والحبوب وكل أساسيات المطبخ المصري في مكان واحد.">
  <meta name="theme-color" content="#344532">
  <meta property="og:title" content="شقير العطار — عطارة مصرية أصيلة في الرحاب">
  <meta property="og:description" content="ريحة العطارة الأصيلة… في كل تفصيلة. البن والتوابل والأعشاب والحبوب في سوق الرحاب التجاري القديم، محل 23.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/img/entrance.jpg">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/design.js"></script>
  <script src="assets/js/design-apply.js"></script>
</head>
<body data-page="home">

  <div id="app-header"></div>

  <main id="main-content">

    <!-- ═══════════ Hero ═══════════ -->
    <section class="hero" aria-labelledby="heroTitle">
      <div class="container hero-inner">

        <div class="hero-copy">
          <span class="hero-kicker" id="heroKicker"></span>
          <h1 class="hero-title" id="heroTitle"></h1>
          <p class="hero-sub" id="heroSub"></p>
          <div class="hero-ctas">
            <a class="btn btn-brass btn-lg" href="products.html" id="heroCta1"></a>
            <a class="btn btn-outline-light btn-lg" href="contact.html" id="heroCta2"></a>
          </div>
          <ul class="hero-points" id="heroPoints"></ul>
        </div>

        <div class="hero-visual">
          <div class="arch-back">
            <img id="heroBack" src="assets/img/interior-counter.png" alt="من داخل العطارة" loading="eager">
          </div>
          <figure class="arch arch-main">
            <img id="heroEntrance" src="assets/img/entrance.jpg" alt="واجهة العطارة">
          </figure>
          <div class="hero-chip" id="heroChip"></div>
        </div>

      </div>
    </section>

    <!-- ═══════════ القهوة ═══════════ -->
    <section class="section section-pattern-light" aria-labelledby="coffeeTitle">
      <div class="container">
        <div class="section-head center">
          <span class="kicker" id="coffeeKicker"></span>
          <h2 class="section-title" id="coffeeTitle"></h2>
          <p class="section-sub" id="coffeeSub"></p>
        </div>
        <div class="roast-grid" id="roastGrid"></div>
        <p style="text-align:center; margin-top:34px">
          <a class="btn btn-outline-dark" href="coffee.html" id="coffeeMoreBtn"></a>
        </p>
      </div>
    </section>

    <!-- ═══════════ أقسام العطارة ═══════════ -->
    <section class="section section-alt" aria-labelledby="catsTitle">
      <div class="container">
        <div class="section-head">
          <span class="kicker" id="catsKicker"></span>
          <h2 class="section-title" id="catsTitle"></h2>
          <p class="section-sub" id="catsSub"></p>
        </div>
        <div class="cat-grid" id="catGrid"></div>
      </div>
    </section>

    <!-- ═══════════ البهارات المميزة ═══════════ -->
    <section class="section section-dark" aria-labelledby="spiceTitle">
      <div class="container">
        <div class="section-head center">
          <span class="kicker" id="spiceKicker"></span>
          <h2 class="section-title" id="spiceTitle"></h2>
          <p class="section-sub" id="spiceSub"></p>
        </div>
        <div class="spice-grid" id="spiceGrid"></div>
        <p style="text-align:center; margin-top:38px">
          <a class="btn btn-outline-light" href="spices.html" id="spiceMoreBtn"></a>
        </p>
      </div>
    </section>

    <!-- ═══════════ تجربة العطارة ═══════════ -->
    <section class="section" aria-labelledby="storeTitle">
      <div class="container gallery-layout">

        <div class="gallery-stack">
          <figure class="g-main">
            <img id="galleryMain" src="assets/img/interior-aisle.png" alt="ممرات العطارة" loading="lazy">
          </figure>
          <div class="g-row" id="galleryRow"></div>
        </div>

        <div>
          <span class="kicker" id="storeKicker"></span>
          <h2 class="section-title" id="storeTitle" style="margin-bottom:14px"></h2>
          <p class="section-sub" id="storeSub" style="margin-top:0"></p>
          <ul class="story-list" id="storeList"></ul>
          <a class="btn btn-olive" href="about.html" id="storeBtn"></a>
        </div>

      </div>
    </section>

    <!-- ═══════════ منتجات مختارة ═══════════ -->
    <section class="section section-alt" aria-labelledby="featuredTitle">
      <div class="container">
        <div class="section-head">
          <span class="kicker" id="featuredKicker"></span>
          <h2 class="section-title" id="featuredTitle"></h2>
          <p class="section-sub" id="featuredSub"></p>
        </div>
        <div class="product-grid" id="featuredGrid"></div>
        <p style="text-align:center; margin-top:38px">
          <a class="btn btn-brass" href="products.html" id="featuredMoreBtn"></a>
        </p>
      </div>
    </section>

    <!-- ═══════════ Wael Food ═══════════ -->
    <section class="section section-dark" aria-labelledby="waelTitle">
      <div class="container wael-layout">

        <div class="wael-visual">
          <img id="waelImg" src="assets/img/interior-counter.png" alt="رفوف منتجات Wael Food" loading="lazy">
          <span class="wael-tag" id="waelTag"></span>
        </div>

        <div>
          <span class="kicker" id="waelKicker"></span>
          <h2 class="section-title" id="waelTitle" style="margin-bottom:14px"></h2>
          <p class="section-sub" id="waelSub" style="margin-top:0"></p>
          <ul class="story-list wael-points" id="waelPoints"></ul>
          <a class="btn btn-outline-light" href="products.html?cat=other" id="waelBtn"></a>
        </div>

      </div>
    </section>

    <!-- ═══════════ المكان ═══════════ -->
    <section class="section" aria-labelledby="locTitle">
      <div class="container">
        <div class="section-head">
          <span class="kicker" id="locKicker"></span>
          <h2 class="section-title" id="locTitle"></h2>
          <p class="section-sub" id="locSub"></p>
        </div>
        <div class="location-layout">
          <div class="location-card">
            <div class="contact-row">
              <span class="contact-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></span>
              <div><h4 id="locAddressLabel"></h4><p id="addressText"></p></div>
            </div>
            <a class="contact-row" href="tel:+201095752548" id="locPhoneRow">
              <span class="contact-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>
              <div><h4 id="locPhoneLabel"></h4><p id="phonesText"></p></div>
            </a>
            <div class="location-ctas">
              <a class="btn btn-olive" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=Shop+23%2C+Old+Rehab+Commercial+Market%2C+Layali+El+Moez+Cafe%2C+Rehab%2C+New+Cairo%2C+Egypt" id="mapsLink1"></a>
              <a class="btn btn-outline-dark" href="contact.html" id="locBtn2"></a>
            </div>
          </div>
          <div class="map-frame">
            <iframe id="homeMap" title="موقع العطارة على الخريطة" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
        </div>
      </div>
    </section>

    <!-- ═══════════ واتساب ═══════════ -->
    <section class="section section-olive wa-band" aria-labelledby="waTitle">
      <div class="container" style="max-width:720px">
        <span class="wa-icon-big">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
        </span>
        <h2 class="section-title" id="waTitle"></h2>
        <p class="section-sub" id="waSub"></p>
        <a class="btn btn-brass btn-lg" target="_blank" rel="noopener" href="https://wa.me/201095752548" id="waBtn"></a>
      </div>
    </section>

  </main>

  <div id="app-footer"></div>
  <div class="search-overlay" id="searchOverlay"></div>

  <script src="assets/js/content.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/editor.js"></script>
  <script>
    /* تعبئة بيانات التواصل الديناميكية في صفحة الرئيسية */
    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById("addressText").textContent = SITE.addressAr;
      document.getElementById("phonesText").innerHTML = SITE.phones.map(function (p) {
        return '<span class="num">' + p.label + "</span>";
      }).join(" · ");
      document.getElementById("locPhoneRow").href = "tel:" + SITE.phones[0].tel;
      document.getElementById("mapsLink1").textContent = CONTENT.home.location.btn1;
      document.getElementById("mapsLink1").href = SITE.mapsUrl;
      document.getElementById("waBtn").href = "https://wa.me/" + SITE.whatsapp + "?text=" + encodeURIComponent(SITE.msgs.general);
    });
  </script>
</body>
</html>
